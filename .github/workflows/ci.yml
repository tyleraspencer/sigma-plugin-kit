name: CI

# Quoted "on" -- unquoted `on:` is parsed as the boolean `true` by strict
# YAML 1.1 loaders (PyYAML, yamllint, etc.); GitHub's own workflow parser
# special-cases the bare form so it works either way, but quoting avoids
# the ambiguity outright.
#
# workflow_dispatch gives a manual "Run workflow" button under the Actions
# tab in GitHub's UI -- no CLI/API call needed to trigger a run by hand.
"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- bash -n over every .sh file in the repo ---
      - name: bash -n over every .sh file
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "Syntax error: $f" >&2; fail=1; }
          done < <(find . -path ./.git -prune -o -type f -name '*.sh' -print0)
          exit "$fail"

      # --- python3 -m py_compile over every .py file in the repo ---
      - name: py_compile every .py file (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            python3 -m py_compile "$f" || fail=1
          done < <(find . -path ./.git -prune -o -type f -name '*.py' -print0)
          exit "$fail"

      - name: py_compile every .py file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Path . -Recurse -File -Filter *.py |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            ForEach-Object {
              python -m py_compile $_.FullName
              if ($LASTEXITCODE -ne 0) { $fail = 1 }
            }
          exit $fail

      # --- JSON parse validity over every .json file, excluding .git/ ---
      # This is what actually gates the plugin manifests: a marketplace.json
      # or plugin.json that doesn't parse makes the plugin silently
      # undiscoverable rather than failing loudly at install time.
      - name: JSON validity over every .json file (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" \
              || { echo "Invalid JSON: $f" >&2; fail=1; }
          done < <(find . -path ./.git -prune -o -type f -name '*.json' -print0)
          exit "$fail"

      - name: JSON validity over every .json file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Path . -Recurse -File -Filter *.json |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            ForEach-Object {
              python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" $_.FullName
              if ($LASTEXITCODE -ne 0) { Write-Host "Invalid JSON: $($_.FullName)"; $fail = 1 }
            }
          exit $fail

      # --- Every skills/<name>/SKILL.md must carry name + description
      # --- frontmatter. `description` is the entire activation mechanism, so
      # --- a skill missing it installs fine and then never fires. ---
      - name: SKILL.md frontmatter
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, sys
          fail = 0
          paths = sorted(glob.glob('skills/*/SKILL.md'))
          if not paths:
              print('no skills/*/SKILL.md found', file=sys.stderr)
              sys.exit(1)
          for p in paths:
              text = open(p, encoding='utf-8').read()
              if not text.startswith('---\n'):
                  print(f'{p}: missing YAML frontmatter', file=sys.stderr)
                  fail = 1
                  continue
              fm = text.split('---\n', 2)[1]
              for key in ('name', 'description'):
                  if not any(line.startswith(key + ':') for line in fm.splitlines()):
                      print(f'{p}: frontmatter missing {key}:', file=sys.stderr)
                      fail = 1
              print(f'checked {p}')
          sys.exit(fail)
          PY
      # --- exec-bit assertion: every scripts/api/*.sh except _env.sh and
      # --- _state.sh (both meant to be sourced, not executed) must be mode
      # --- 100755 ---
      - name: exec-bit assertion on scripts/api/*.sh
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while read -r mode _ _ path; do
            base="${path##*/}"
            [ "$base" = "_env.sh" ] && continue
            [ "$base" = "_state.sh" ] && continue
            if [ "$mode" != "100755" ]; then
              echo "Missing exec bit (mode $mode): $path" >&2
              fail=1
            fi
          done < <(git ls-files -s scripts/api/*.sh)
          exit "$fail"
      # --- plugins/_react-template is the only plugin source this repo
      # --- tracks: deployed plugins live in the public host repo, and
      # --- deploy-plugin.sh gates them at the moment they become a public
      # --- URL. This keeps what new-plugin.sh copies from honest. ---
      - name: plugin template sanity
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          fail = 0

          def bad(msg):
              global fail
              print(msg, file=sys.stderr)
              fail = 1

          root = pathlib.Path('plugins/_react-template')

          # Every plugin is a Vite + React project. The single-file archetype
          # was removed deliberately: a page loading the SDK's UMD bundle from
          # a CDN renders fallback data forever if React isn't loaded first,
          # and the only symptom is one uncaught console error. If a
          # hand-written template ever reappears, this fails.
          stray = sorted(p for p in pathlib.Path('plugins').glob('_*/index.html')
                         if p.parent.name != '_react-template')
          for p in stray:
              bad(f'{p}: a non-React plugin template reappeared. Every plugin is a '
                  f'Vite + React project; see docs/plugins.md.')

          pkg = json.loads((root / 'package.json').read_text(encoding='utf-8'))
          deps = pkg.get('dependencies') or {}
          for dep in ('@sigmacomputing/plugin', 'react', 'react-dom'):
              if dep not in deps:
                  bad(f'{root}/package.json: missing the {dep} dependency.')
          if 'build' not in (pkg.get('scripts') or {}):
              bad(f'{root}/package.json: no build script -- deploy-plugin.sh runs `npm run build`.')

          vite = (root / 'vite.config.js').read_text(encoding='utf-8')
          # base:'./' is load-bearing: the default '/' emits absolute asset
          # paths that 404 under the Pages subpath, leaving a blank iframe.
          if "base: './'" not in vite:
              bad(f"{root}/vite.config.js: must set base: './' or the build's assets "
                  f"404 under the Pages subpath.")

          html = (root / 'index.html').read_text(encoding='utf-8')
          # A CDN script tag here would reintroduce the archetype, and its
          # silent-fallback failure, inside a project that looks bundled.
          if re.search(r'<script[^>]*\bsrc\s*=\s*["\'][^"\']*sigmacomputing-plugin', html):
              bad(f'{root}/index.html: loads the SDK from a script tag. A bundled '
                  f'plugin must import the client from @sigmacomputing/plugin.')

          # The same rules apply to the template's App.jsx and to every
          # archetype new-plugin.sh --from can drop in its place, so they are
          # checked by one function rather than two drifting copies. An
          # archetype that fails these ships a broken plugin to whoever picks
          # it, and nothing downstream would catch it: preflight only ever sees
          # an already-scaffolded plugin, never the archetype itself.
          def check_app(path, app):
              if 'configureEditorPanel' not in app:
                  bad(f'{path}: never calls configureEditorPanel, so the plugin '
                      f'would expose no bindings.')
              if '__PLUGIN_TITLE__' not in app:
                  bad(f'{path}: missing the __PLUGIN_TITLE__ placeholder.')
              if "from '@sigmacomputing/plugin'" not in app:
                  bad(f"{path}: never imports from '@sigmacomputing/plugin'.")
              # A window global reads undefined in a bundled plugin and the
              # plugin renders its fallback forever, looking fine in a
              # screenshot.
              for g in ('window.sigmaComputing', 'window.SigmaPlugin'):
                  if g in app:
                      bad(f'{path}: reaches for {g}; import the client instead.')
              # An unguarded ResizeObserver whose callback re-renders into the
              # observed element is an infinite loop that pins a CPU core silently.
              if 'ResizeObserver' in app and not any(
                      g in app for g in ('clientWidth', 'clientHeight', 'contentRect')):
                  bad(f'{path}: ResizeObserver with no size comparison.')
              # A fallback render nobody can identify is indistinguishable from
              # a working one -- which is the failure this whole kit is built
              # around.
              if re.search(r'\bisDemo\b|\bfallback\b', app) and not re.search(
                      r'badge|demo data', app, re.I):
                  bad(f'{path}: renders fallback data with no visible badge.')

          check_app(f'{root}/src/App.jsx', (root / 'src' / 'App.jsx').read_text(encoding='utf-8'))
          print(f'checked {root}')

          archetypes = sorted(pathlib.Path('plugins/_archetypes').glob('*.jsx'))
          for a in archetypes:
              check_app(str(a), a.read_text(encoding='utf-8'))
              print(f'checked {a}')

          sys.exit(fail)
          PY

      # --- doctor.sh smoke run -- confirm it runs; its exit code isn't
      # --- enforced across platforms yet (see doctor.sh's own comments) ---
      - name: doctor.sh smoke run
        shell: bash
        run: bash scripts/doctor.sh || true
