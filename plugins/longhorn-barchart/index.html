<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Longhorn Bar Chart</title>
<!--
  Texas Longhorn themed horizontal bar chart.

  Built from plugins/_template/index.html; the SDK wiring is unchanged. The
  only global the UMD bundle defines is window.SigmaPlugin, with the client at
  SigmaPlugin.client -- see docs/plugins.md.
-->
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,"Segoe UI",Roboto,Arial,sans-serif;
       background:transparent;color:#333F48;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column;padding:14px 18px;gap:12px}
  #top{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;gap:10px}
  #brand{display:flex;align-items:center;gap:9px;min-width:0}
  #horns{flex:0 0 auto}
  #ttl{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
       color:#BF5700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  #total{font-size:11px;color:#7A6A60}
  #total b{color:#333F48;font-variant-numeric:tabular-nums}
  #badge{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
         padding:3px 7px;border-radius:3px;background:#FDEBD8;color:#8E4000;display:none}
  #badge.on{display:inline-block}
  #rows{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0;overflow:hidden}
  .row{display:grid;grid-template-columns:minmax(72px,24%) 1fr auto;gap:10px;align-items:center;
       font-size:11px}
  .name{color:#4A5560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .track{background:#F4EFEA;border-radius:3px;height:16px;overflow:hidden;position:relative}
  .fill{height:100%;border-radius:3px;
        background:linear-gradient(90deg,#D9772F 0%,#BF5700 62%,#8E4000 100%);
        transition:width .3s cubic-bezier(.22,.61,.36,1)}
  .row.lead .fill{background:linear-gradient(90deg,#BF5700 0%,#8E4000 100%)}
  .row.lead .name{color:#BF5700}
  .val{color:#333F48;font-variant-numeric:tabular-nums;font-weight:700;min-width:46px;text-align:right}
  #foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
        font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:#A89A90}
  #empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
         font-size:11px;color:#A89A90;line-height:1.6;padding:0 24px}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div id="brand">
      <!-- Longhorn silhouette: sweeping horns over a head. -->
      <svg id="horns" width="34" height="17" viewBox="0 0 68 34" aria-hidden="true">
        <path d="M34 20c-3.4 0-6.2-2.1-6.2-5.4 0-1 .2-1.9.6-2.7C25 12.4 21 13 17 13 10 13 4 10.6 1 6.6c-.7-.9-.5-2.2.5-2.8.9-.6 2.1-.4 2.8.5C6.7 7.4 11.5 9.2 17 9.2c5 0 9.6-1 13-2.6C31.4 5.9 32.7 5.6 34 5.6s2.6.3 4 1c3.4 1.6 8 2.6 13 2.6 5.5 0 10.3-1.8 12.7-4.9.7-.9 1.9-1.1 2.8-.5 1 .6 1.2 1.9.5 2.8C64 10.6 58 13 51 13c-4 0-8-.6-11.4-1.1.4.8.6 1.7.6 2.7 0 3.3-2.8 5.4-6.2 5.4z" fill="#BF5700"/>
        <ellipse cx="34" cy="24" rx="6.4" ry="7.4" fill="#BF5700"/>
        <circle cx="31.4" cy="22.6" r="1.05" fill="#FFF"/>
        <circle cx="36.6" cy="22.6" r="1.05" fill="#FFF"/>
      </svg>
      <div id="ttl">Longhorn Bar Chart</div>
    </div>
    <div id="right">
      <div id="total">total <b id="tot">—</b></div>
      <div id="badge">demo data</div>
    </div>
  </div>
  <div id="rows"></div>
  <div id="foot"><span>Hook &rsquo;em</span><span id="count"></span></div>
</div>
<script>
(function(){
  "use strict";

  // The UMD bundle defines exactly one global: `SigmaPlugin`, with the
  // imperative client at `SigmaPlugin.client`. Verified against 1.3.2 and
  // 1.2.0 -- `window.sigmaComputing.plugin.client` is a widely-copied myth
  // that no published bundle has ever defined, and a plugin reading it just
  // silently renders its fallback forever. The legacy path is kept in the
  // chain only so an older bundle that did export it would still work.
  var sdk = window.SigmaPlugin
         || (window.sigmaComputing && window.sigmaComputing.plugin)
         || null;
  var client = (sdk && sdk.client) || null;

  var DEFS = [
    { name: 'source', type: 'element' },
    { name: 'label',  type: 'column', source: 'source', label: 'Label',
      allowedTypes: ['text'] },
    { name: 'value',  type: 'column', source: 'source', label: 'Value',
      allowedTypes: ['number','integer'] }
  ];
  if (client) client.config.configureEditorPanel(DEFS);

  var MAX_ROWS = 10;

  function fmt(v){
    v = Number(v) || 0;
    var abs = Math.abs(v);
    if (abs >= 1e9) return (v/1e9).toFixed(1) + 'B';
    if (abs >= 1e6) return (v/1e6).toFixed(1) + 'M';
    if (abs >= 1e3) return (v/1e3).toFixed(1) + 'k';
    return String(Math.round(v));
  }

  function draw(pairs, isDemo){
    document.getElementById('badge').className = isDemo ? 'on' : '';
    var host = document.getElementById('rows');
    host.innerHTML = '';

    if (!pairs.length){
      var e = document.createElement('div');
      e.id = 'empty';
      e.textContent = 'Bind an element, a label column and a value column in the editor panel.';
      host.appendChild(e);
      document.getElementById('tot').textContent = '—';
      document.getElementById('count').textContent = '';
      return;
    }

    pairs = pairs.slice()
                 .sort(function(a,b){ return b.value - a.value; })
                 .slice(0, MAX_ROWS);
    // Guard a zero/negative max so the width math can't divide by zero.
    var max = pairs.reduce(function(m,p){ return Math.max(m, p.value); }, 0) || 1;
    var sum = pairs.reduce(function(s,p){ return s + p.value; }, 0);

    pairs.forEach(function(p, i){
      var row = document.createElement('div');
      row.className = 'row' + (i === 0 ? ' lead' : '');
      var name = document.createElement('div');
      name.className = 'name'; name.textContent = p.label; name.title = p.label;
      var track = document.createElement('div'); track.className = 'track';
      var fill = document.createElement('div'); fill.className = 'fill';
      fill.style.width = Math.max(0, (p.value / max) * 100) + '%';
      track.appendChild(fill);
      var val = document.createElement('div');
      val.className = 'val'; val.textContent = fmt(p.value);
      row.appendChild(name); row.appendChild(track); row.appendChild(val);
      host.appendChild(row);
    });

    document.getElementById('tot').textContent = fmt(sum);
    document.getElementById('count').textContent = pairs.length + ' of ' + pairs.length;
  }

  // Deterministic demo data: Texas longhorn herd by region. A plugin that
  // reshuffles every render can't be screenshot or eyeballed for regressions.
  function synth(){
    return [
      { label: 'Hill Country',  value: 6820 },
      { label: 'Panhandle',     value: 6310 },
      { label: 'South Texas',   value: 5240 },
      { label: 'Brazos Valley', value: 4180 },
      { label: 'East Texas',    value: 3460 },
      { label: 'Permian Basin', value: 2270 },
      { label: 'Big Bend',      value: 1540 }
    ];
  }

  // subscribeToElementData yields an object keyed by column ID, each value a
  // parallel array of cells -- NOT an array of row objects. Zip by index.
  function toPairs(data, cfg){
    if (!data || !cfg || !cfg.label || !cfg.value) return null;
    var labels = data[cfg.label], values = data[cfg.value];
    if (!labels || !values) return null;
    var out = [];
    for (var i = 0; i < values.length; i++){
      var v = Number(values[i]);
      if (!isFinite(v)) continue;
      out.push({
        label: String(labels[i] === null || labels[i] === undefined ? '—' : labels[i]),
        value: v
      });
    }
    return out.length ? out : null;
  }

  var state = { cfg: null, data: null, unsub: null };

  function recompute(){
    var pairs = toPairs(state.data, state.cfg);
    if (pairs) draw(pairs, false);
    else if (state.cfg && state.cfg.source) draw([], false);  // bound, still loading
    else draw(synth(), true);                                  // nothing bound -> demo
  }

  if (client){
    client.config.subscribe(function(cfg){
      state.cfg = cfg || {};
      // Drop the previous element subscription before opening a new one, or
      // re-binding the source leaks a live listener that keeps overwriting
      // state.data with the old element's rows.
      if (state.unsub){ state.unsub(); state.unsub = null; }
      state.data = null;
      if (state.cfg.source){
        state.unsub = client.elements.subscribeToElementData(
          state.cfg.source,
          function(d){ state.data = d; recompute(); }
        );
      }
      recompute();
    });
  } else {
    recompute();
  }
})();
</script>
</body>
</html>
