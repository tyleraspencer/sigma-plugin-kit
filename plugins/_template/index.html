<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>__PLUGIN_TITLE__</title>
<!--
  Single-file Sigma custom-viz plugin. No build step, no bundler.

  Use this archetype for hand-rolled DOM/SVG/canvas. If you need npm packages
  (Plotly, Mapbox, D3, Recharts), use the React archetype instead:
  `new-plugin.sh <name> "Title" --react`.

  The SDK's UMD bundle defines ONE global, `SigmaPlugin`, and
  `SigmaPlugin.client` is a pre-initialized instance.
  `window.sigmaComputing.plugin.client` is a widely-copied pattern that no
  published bundle has ever defined — read it and `client` is null, so the
  plugin renders its fallback forever while looking fine in a screenshot.

  React is an *external* of the UMD build, so the hooks need `window.React`
  loaded first. This file uses only the imperative `client`, so it doesn't.

  Full API — all 14 editor-panel types, variables, actions, interactions:
  docs/plugin-api.md.
-->
<script src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,"Segoe UI",Roboto,Arial,sans-serif;
       background:transparent;color:#1f2937;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column;padding:12px 16px;gap:10px}
  #top{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;gap:8px}
  #ttl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#374151}
  #badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
         padding:2px 6px;border-radius:3px;background:#fef3c7;color:#92400e;display:none}
  #badge.on{display:inline-block}
  #rows{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
  .row{display:grid;grid-template-columns:minmax(60px,22%) 1fr auto;gap:8px;align-items:center;
       font-size:11px;cursor:pointer}
  .row.sel .name{font-weight:700;color:#111827}
  .row.dim{opacity:.35}
  .name{color:#4b5563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track{background:#f3f4f6;border-radius:3px;height:14px;overflow:hidden}
  .fill{height:100%;border-radius:3px;transition:width .25s ease}
  .val{color:#111827;font-variant-numeric:tabular-nums;font-weight:600}
  #hint{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
        font-size:11px;color:#9ca3af;line-height:1.6;padding:0 24px}
  #legend{flex:0 0 auto;font-size:9px;color:#9ca3af;display:none}
  #legend.on{display:block}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><div id="ttl">__PLUGIN_TITLE__</div><div id="badge">demo data</div></div>
  <div id="rows"></div>
  <div id="legend"></div>
</div>
<script>
(function(){
  "use strict";

  var sdk = window.SigmaPlugin || null;
  var client = (sdk && sdk.client) || null;

  // --- Editor panel ------------------------------------------------------
  // Each `name` is the key the value arrives under in config AND the key a
  // workbook spec's plugin `config` must use. Renaming one silently unbinds
  // every workbook already using it.
  var DEFS = [
    { type: 'element',  name: 'source' },
    { type: 'column',   name: 'label',  source: 'source', allowMultiple: false,
      allowedTypes: ['text'] },
    { type: 'column',   name: 'value',  source: 'source', allowMultiple: false,
      allowedTypes: ['number', 'integer'] },

    { type: 'group',    name: 'Style' },
    { type: 'color',    name: 'accent',     source: 'Style' },
    { type: 'toggle',   name: 'showTotal',  source: 'Style', defaultValue: true },
    { type: 'dropdown', name: 'sort',       source: 'Style',
      values: ['Value, high to low', 'Value, low to high', 'Label A-Z'],
      defaultValue: 'Value, high to low' },

    // Two-way channel to a workbook control. The author binds a real control
    // here; clicking a bar writes into it, so other elements can filter on it.
    { type: 'variable', name: 'selected', allowedTypes: ['text'] }
  ];
  if (client) client.config.configureEditorPanel(DEFS);

  var MAX_ROWS = 12;
  var state = { cfg: null, data: null, unsub: null, selected: null };

  function fmt(v){
    v = Number(v) || 0;
    var a = Math.abs(v);
    if (a >= 1e9) return (v/1e9).toFixed(1) + 'B';
    if (a >= 1e6) return (v/1e6).toFixed(1) + 'M';
    if (a >= 1e3) return (v/1e3).toFixed(1) + 'k';
    return String(Math.round(v));
  }

  function show(el, on){ el.className = on ? el.className.replace(/\s*\bon\b/, '') + ' on'
                                           : el.className.replace(/\s*\bon\b/, ''); }

  function draw(pairs, isDemo){
    var cfg = state.cfg || {};
    show(document.getElementById('badge'), !!isDemo);

    var host = document.getElementById('rows');
    host.innerHTML = '';
    if (!pairs.length){
      var h = document.createElement('div');
      h.id = 'hint';
      h.textContent = client && client.sigmaEnv === 'author'
        ? 'Bind an element, a label column and a value column in the editor panel.'
        : 'No data to display.';
      host.appendChild(h);
      show(document.getElementById('legend'), false);
      return;
    }

    var sorted = pairs.slice();
    if (cfg.sort === 'Label A-Z') sorted.sort(function(a,b){ return String(a.label).localeCompare(b.label); });
    else if (cfg.sort === 'Value, low to high') sorted.sort(function(a,b){ return a.value - b.value; });
    else sorted.sort(function(a,b){ return b.value - a.value; });
    sorted = sorted.slice(0, MAX_ROWS);

    // Guard a zero/negative max so the width math can't divide by zero.
    var max = sorted.reduce(function(m,p){ return Math.max(m, p.value); }, 0) || 1;
    var accent = cfg.accent || '#2563eb';
    var anySel = state.selected !== null && state.selected !== undefined;

    sorted.forEach(function(p){
      var isSel = anySel && String(p.label) === String(state.selected);
      var row = document.createElement('div');
      row.className = 'row' + (isSel ? ' sel' : (anySel ? ' dim' : ''));
      var name = document.createElement('div');
      name.className = 'name'; name.textContent = p.label; name.title = p.label;
      var track = document.createElement('div'); track.className = 'track';
      var fill = document.createElement('div'); fill.className = 'fill';
      fill.style.width = Math.max(0, (p.value / max) * 100) + '%';
      fill.style.background = accent;
      track.appendChild(fill);
      var val = document.createElement('div'); val.className = 'val'; val.textContent = fmt(p.value);
      row.appendChild(name); row.appendChild(track); row.appendChild(val);
      row.addEventListener('click', function(){ select(isSel ? null : p.label); });
      host.appendChild(row);
    });

    var legend = document.getElementById('legend');
    if (cfg.showTotal !== false){
      var total = sorted.reduce(function(s,p){ return s + p.value; }, 0);
      legend.textContent = sorted.length + ' of ' + pairs.length + '  ·  total ' + fmt(total);
      show(legend, true);
    } else {
      show(legend, false);
    }
  }

  // --- Write the click back into a workbook control ----------------------
  // This is what makes the plugin cross-filter: other elements filter on the
  // bound control. setVariable is variadic -- a list control takes several.
  function select(label){
    state.selected = label;
    var varId = state.cfg && state.cfg.selected;
    if (client && varId){
      if (label === null) client.config.setVariable(varId);
      else client.config.setVariable(varId, String(label));
    }
    recompute();
  }

  // Deterministic on purpose: a plugin that reshuffles every render can't be
  // screenshotted or eyeballed for regressions.
  function synth(){
    return ['North','South','East','West','Central','Coastal','Mountain','Valley']
      .map(function(n,i){ return { label:n, value: Math.round(4200*Math.exp(-i*0.28) + 180*((i*7)%5)) }; });
  }

  // Data arrives KEYED BY COLUMN ID -- an object of parallel arrays, not row
  // objects. Zip by index. Capped at 25,000 values; past that use the
  // incremental API (docs/plugin-api.md).
  function toPairs(data, cfg){
    if (!data || !cfg || !cfg.label || !cfg.value) return null;
    var labels = data[cfg.label], values = data[cfg.value];
    if (!labels || !values) return null;
    var out = [];
    for (var i = 0; i < values.length; i++){
      var v = Number(values[i]);
      if (!isFinite(v)) continue;
      out.push({ label: String(labels[i] == null ? '—' : labels[i]), value: v });
    }
    return out.length ? out : null;
  }

  function recompute(){
    var pairs = toPairs(state.data, state.cfg);
    if (pairs) draw(pairs, false);
    else if (state.cfg && state.cfg.source) draw([], false);   // bound, still loading
    else draw(synth(), true);                                   // nothing bound -> demo
  }

  if (client){
    client.config.setLoadingState(true);
    client.config.subscribe(function(cfg){
      state.cfg = cfg || {};

      // Always release the previous element subscription before opening a new
      // one, or re-binding the source leaks a listener that keeps overwriting
      // state.data with the old element's rows.
      if (state.unsub){ state.unsub(); state.unsub = null; }
      state.data = null;

      if (state.cfg.source){
        state.unsub = client.elements.subscribeToElementData(
          state.cfg.source,
          function(d){ state.data = d; client.config.setLoadingState(false); recompute(); });
      } else {
        client.config.setLoadingState(false);
      }

      // The CURRENT value of a variable lives at .defaultValue.value, despite
      // the name. Reading `.value` directly gets you undefined.
      if (state.cfg.selected){
        var v = client.config.getVariable(state.cfg.selected);
        state.selected = (v && v.defaultValue && v.defaultValue.value) || null;
      }
      recompute();
    });
  } else {
    recompute();   // opened directly in a browser -- render the demo data
  }

  // Sigma documents no resize event and no auto-height, so watch the iframe
  // ourselves and re-layout.
  if (window.ResizeObserver){
    new ResizeObserver(function(){ recompute(); }).observe(document.body);
  }
})();
</script>
</body>
</html>
