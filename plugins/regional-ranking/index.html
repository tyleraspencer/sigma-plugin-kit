<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Regional Ranking</title>
<!--
  A Sigma custom-viz plugin: one self-contained file, no build step.

  The SDK is loaded from unpkg as a UMD bundle and read off
  window.SigmaPlugin.client -- see the note by `var sdk` below, because the
  commonly-copied global is wrong. Pin a version
  (…/@sigmacomputing/plugin@1.3.2) if you want deploys to stop moving
  under you.

  Three things this file demonstrates, all of which you want in any plugin:
    1. configureEditorPanel  -- declares the bindings Sigma shows in the editor
    2. subscribe + subscribeToElementData  -- reads live data
    3. a synthetic fallback  -- renders demo data when nothing is bound yet,
       so the frame is never blank in the editor or in a screenshot

  It also runs with no Sigma client at all, so you can open it directly in a
  browser (or via `python3 -m http.server`) while iterating.
-->
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,"Segoe UI",Roboto,Arial,sans-serif;
       background:transparent;color:#1f2937;overflow:hidden}
  #wrap{height:100%;display:flex;flex-direction:column;padding:12px 16px;gap:10px}
  #top{display:flex;justify-content:space-between;align-items:baseline;flex:0 0 auto}
  #ttl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#374151}
  #badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
         padding:2px 6px;border-radius:3px;background:#fef3c7;color:#92400e;display:none}
  #badge.on{display:inline-block}
  #rows{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
  .row{display:grid;grid-template-columns:minmax(60px,22%) 1fr auto;gap:8px;align-items:center;font-size:11px}
  .name{color:#4b5563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track{background:#f3f4f6;border-radius:3px;height:14px;overflow:hidden}
  .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#60a5fa,#2563eb);
        transition:width .25s ease}
  .val{color:#111827;font-variant-numeric:tabular-nums;font-weight:600}
  #empty{flex:1;display:flex;align-items:center;justify-content:center;
         font-size:11px;color:#9ca3af;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><div id="ttl">Regional Ranking</div><div id="badge">demo data</div></div>
  <div id="rows"></div>
</div>
<script>
(function(){
  "use strict";

  // The UMD bundle defines exactly one global: `SigmaPlugin`, with the
  // imperative client at `SigmaPlugin.client`. Verified against 1.3.2 and
  // 1.2.0 -- `window.sigmaComputing.plugin.client` is a widely-copied myth
  // that no published bundle has ever defined, and a plugin reading it just
  // silently renders its fallback forever. The legacy path is kept in the
  // chain only so an older bundle that did export it would still work.
  var sdk = window.SigmaPlugin
         || (window.sigmaComputing && window.sigmaComputing.plugin)
         || null;
  var client = (sdk && sdk.client) || null;

  // Only `client` is used below, never the React hooks, so React is not
  // needed even though the UMD build lists it as a peer.

  // --- Editor panel -------------------------------------------------------
  // `name` is the key this binding arrives under in the config object, and is
  // what a workbook spec's plugin `config` must use. `source` ties a column
  // picker to the chosen element. Supported types include element, column,
  // text, toggle, and dropdown -- see docs/plugins.md.
  var DEFS = [
    { name: 'source', type: 'element' },
    { name: 'label',  type: 'column', source: 'source', label: 'Label',
      allowedTypes: ['text'] },
    { name: 'value',  type: 'column', source: 'source', label: 'Value',
      allowedTypes: ['number','integer'] }
  ];
  if (client) client.config.configureEditorPanel(DEFS);

  // --- Rendering ----------------------------------------------------------
  var MAX_ROWS = 12;

  function fmt(v){
    v = Number(v) || 0;
    var abs = Math.abs(v);
    if (abs >= 1e9) return (v/1e9).toFixed(1) + 'B';
    if (abs >= 1e6) return (v/1e6).toFixed(1) + 'M';
    if (abs >= 1e3) return (v/1e3).toFixed(1) + 'k';
    return String(Math.round(v));
  }

  function draw(pairs, isDemo){
    document.getElementById('badge').className = isDemo ? 'on' : '';
    var host = document.getElementById('rows');
    host.innerHTML = '';

    if (!pairs.length){
      var e = document.createElement('div');
      e.id = 'empty';
      e.textContent = 'Bind an element, a label column and a value column in the editor panel.';
      host.appendChild(e);
      return;
    }

    pairs = pairs.slice()
                 .sort(function(a,b){ return b.value - a.value; })
                 .slice(0, MAX_ROWS);
    // Guard against a zero/negative max so the width math can't divide by 0.
    var max = pairs.reduce(function(m,p){ return Math.max(m, p.value); }, 0) || 1;

    pairs.forEach(function(p){
      var row = document.createElement('div'); row.className = 'row';
      var name = document.createElement('div'); name.className = 'name';
      name.textContent = p.label; name.title = p.label;
      var track = document.createElement('div'); track.className = 'track';
      var fill = document.createElement('div'); fill.className = 'fill';
      fill.style.width = Math.max(0, (p.value / max) * 100) + '%';
      track.appendChild(fill);
      var val = document.createElement('div'); val.className = 'val';
      val.textContent = fmt(p.value);
      row.appendChild(name); row.appendChild(track); row.appendChild(val);
      host.appendChild(row);
    });
  }

  // --- Synthetic fallback -------------------------------------------------
  // Deterministic on purpose: a plugin that reshuffles on every render is
  // impossible to screenshot or eyeball for regressions.
  function synth(){
    var names = ['North','South','East','West','Central','Coastal','Mountain','Valley'];
    return names.map(function(n,i){
      return { label: n, value: Math.round(4200 * Math.exp(-i * 0.28) + 180 * ((i * 7) % 5)) };
    });
  }

  // --- Data wiring --------------------------------------------------------
  // subscribeToElementData yields an object keyed by column ID, each value a
  // parallel array of cells -- NOT an array of row objects. Zip them by index.
  function toPairs(data, cfg){
    if (!data || !cfg || !cfg.label || !cfg.value) return null;
    var labels = data[cfg.label], values = data[cfg.value];
    if (!labels || !values) return null;
    var out = [];
    for (var i = 0; i < values.length; i++){
      var v = Number(values[i]);
      if (!isFinite(v)) continue;
      out.push({ label: String(labels[i] === null || labels[i] === undefined ? '—' : labels[i]),
                 value: v });
    }
    return out.length ? out : null;
  }

  var state = { cfg: null, data: null, unsub: null };

  function recompute(){
    var pairs = toPairs(state.data, state.cfg);
    if (pairs) draw(pairs, false);
    else if (state.cfg && state.cfg.source) draw([], false);  // bound, still loading
    else draw(synth(), true);                                  // nothing bound -> demo
  }

  if (client){
    client.config.subscribe(function(cfg){
      state.cfg = cfg || {};
      // Always drop the previous element subscription before opening a new
      // one, or re-binding the source leaks a live listener that keeps
      // overwriting state.data with the old element's rows.
      if (state.unsub){ state.unsub(); state.unsub = null; }
      state.data = null;
      if (state.cfg.source){
        state.unsub = client.elements.subscribeToElementData(
          state.cfg.source,
          function(d){ state.data = d; recompute(); }
        );
      }
      recompute();
    });
  } else {
    recompute();
  }
})();
</script>
</body>
</html>
